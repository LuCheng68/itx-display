plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lucheng.itxdisplay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lucheng.itxdisplay'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '0.5.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation project(':droiduvc')
}
