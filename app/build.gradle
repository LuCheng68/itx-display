plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lucheng.itxdisplay'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lucheng.itxdisplay'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'io.github.mikimn:droiduvc:0.2.1'
}
